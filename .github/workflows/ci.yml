name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Node is needed for the J2 tests, which call the JS checker and sandbox.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          DETERMINAGENT_REQUIRE_SANDBOX: "1"

  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Python is installed only so the parity test can compare both cores.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Re-run the J2 verifier on each Node version, so a reviewed equivalent
      # mutant that only survives on one V8 (such as a sort comparator change)
      # fails the build instead of going stale.
      - run: python tools/golden/j2_verify.py golden/v1/j2-pilot.yaml
        env:
          DETERMINAGENT_PYTHON: python
