[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "determinagent"
version = "0.0.1"
description = "Deterministic routing of typed requests to specialized small language models, improved offline from execution traces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gherkin-official>=29",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
determinagent = "determinagent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"determinagent.spec" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
