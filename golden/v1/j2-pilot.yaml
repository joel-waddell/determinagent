    - {name: just under minus hundred, args: [-100.5%], throws: RangeError}
    - {name: no percent sign, args: ['50'], throws: SyntaxError}
    - {name: empty, args: [''], throws: SyntaxError}
    - {name: plus sign, args: [+5%], throws: SyntaxError}
    - {name: trailing dot, args: [5.%], throws: SyntaxError}
    - {name: number not string, args: [0.5], throws: TypeError}
    - {name: leading dot, args: [.5%], throws: SyntaxError}
    - {name: leading zero, args: [0.5%], returns: 0.005}
    - {name: leading zeros, args: [05%], returns: 0.05}
    - {name: space before the sign, args: [5 %], throws: SyntaxError}
    - {name: space after the minus, args: ['- 5%'], throws: SyntaxError}
