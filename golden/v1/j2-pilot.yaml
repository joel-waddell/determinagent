# DeterminAgent golden set v1, J2 pilot batch (Phase 0.2, Amendment 1).
#
# 27 JavaScript generation cases, all in the dev split. 20 are the original
# drafts, reviewed by the domain expert in the pilot sheet; 7 (J2-P021..P027)
# are clarified variants of cases the expert marked "ask". A case counts only
# once label.status is "labelled"; "draft" cases await the re-check. The visible examples
# are in input.spec; the hidden tests never reach the model. expected.mutation
# is a snapshot written by tools/golden/j2_verify.py. Design: docs/golden-set.md.
version: 1.1.0-j2-pilot
cases:
- id: J2-P001
  task: js_generation
  split: dev
  stratum: strings
  input:
    spec:
      name: slugify
      params:
      - name: title
        type: string
        description: A page title.
      returns:
        type: string
      behavior: Turn a title into a URL slug. Lower-case it, keep only the letters a to z and the digits 0 to 9, and join
        each run of kept characters with a single hyphen. The slug never starts or ends with a hyphen. Throw a TypeError if
        title is not a string.
      examples:
      - {args: [Hello World], returns: hello-world}
      - {args: ['  Rock & Roll!  '], returns: rock-roll}
      - {args: [42], throws: TypeError}
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function slugify(title) {
        if (typeof title !== 'string') throw new TypeError('title must be a string')
        return title
          .toLowerCase()
          .split(/[^a-z0-9]+/)
          .filter((part) => part.length > 0)
          .join('-')
      }
    hidden_tests:
    - {name: empty string, args: [''], returns: ''}
    - {name: only symbols, args: ['!!! ???'], returns: ''}
    - {name: digits kept, args: [Top 10 Tips for 2026], returns: top-10-tips-for-2026}
    - {name: repeated separators collapse, args: [a---b___c], returns: a-b-c}
    - {name: accented letters are dropped, args: [Café au lait], returns: caf-au-lait}
    - {name: already a slug, args: [already-a-slug], returns: already-a-slug}
    - {name: leading and trailing separators, args: [-start and end-], returns: start-and-end}
    - {name: null is not a string, args: [null], throws: TypeError}
    mutation: {"mutants": 5, "killed": 5, "equivalent": 0, "score": 1.0, "survivors": []}
  draft_note: Non-ASCII letters are dropped, not transliterated, because the behavior says "only the letters a to z".
  label:
    status: labelled
    labelled_by: Joel
    verdict: Agree
    notes: Matches the ASCII slug rules, empty cases and TypeError requirement. Listed tests pass.
- id: J2-P002
  task: js_generation
  split: dev
  stratum: strings
  input:
    spec:
      name: truncate
      params:
      - name: text
        type: string
      - name: max
        type: number
        description: The maximum length of the result, at least 1.
      returns:
        type: string
      behavior: Shorten text to at most max characters. If text is already at most max characters, return it unchanged. Otherwise
        cut it and end it with a single ellipsis character (…), so the result, ellipsis included, is exactly max characters
        long. Throw a RangeError if max is not an integer of at least 1.
      examples:
      - {args: [Hello world, 20], returns: Hello world}
      - {args: [Hello world, 6], returns: Hello…}
      - {args: [Hello, 0], throws: RangeError}
  expected:
    route: js_generation
    behavior: ask
    reference_solution: null
    hidden_tests: []
    open_questions:
    - Is a character a UTF-16 code unit, a Unicode code point or a grapheme cluster (what a reader sees)?
  draft_note: Labelled ask by Joel. J2-P021 is the same function with the decision settled.
  label:
    status: labelled
    labelled_by: Joel
    verdict: Correct
    notes: 'Current code truncates by UTF-16 units: truncate(''😀x'', 2) returns a lone surrogate plus the ellipsis. ASCII
      tests do not settle the intended counting rule.'
    requested_changes: Clarify whether characters means UTF-16 code units, Unicode code points or grapheme clusters. Then
      align the reference and add non-BMP and combining-mark tests.
- id: J2-P003
  task: js_generation
  split: dev
  stratum: arrays
  input:
    spec:
      name: chunk
      params:
      - name: items
        type: Array<*>
      - name: size
        type: number
      returns:
        type: Array<Array<*>>
      behavior: Split items into consecutive groups of size elements, in order. The last group holds whatever is left and
        may be shorter. An empty array gives an empty array. Do not change items. Throw a RangeError if size is not a positive
        integer.
      examples:
      - {args: [[1, 2, 3, 4, 5], 2], returns: [[1, 2], [3, 4], [5]]}
      - {args: [[], 3], returns: []}
      constraints:
      - Do not mutate items.
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function chunk(items, size) {
        if (!Number.isInteger(size) || size < 1) throw new RangeError('size must be a positive integer')
        const out = []
        for (let i = 0; i < items.length; i += size) out.push(items.slice(i, i + size))
        return out
      }
    hidden_tests:
    - {name: exact multiple, args: [[1, 2, 3, 4], 2], returns: [[1, 2], [3, 4]]}
    - {name: size larger than array, args: [[1, 2], 5], returns: [[1, 2]]}
    - {name: size one, args: [[a, b, c], 1], returns: [[a], [b], [c]]}
    - {name: keeps element values, args: [[null, 0, false, ''], 3], returns: [[null, 0, false], ['']]}
    - {name: zero size, args: [[1], 0], throws: RangeError}
    - {name: fractional size, args: [[1], 1.5], throws: RangeError}
    - name: does not mutate items
      code: |
        const xs = [1, 2, 3]
        fn(xs, 2)
        assert.equal(xs, [1, 2, 3])
    - name: groups are new arrays
      code: |
        const xs = [1, 2]
        const out = fn(xs, 2)
        assert.ok(out[0] !== xs, 'the group must be a copy')
    mutation: {"mutants": 11, "killed": 11, "equivalent": 0, "score": 1.0, "survivors": []}
  draft_note: null
  label:
    status: labelled
    labelled_by: Joel
    verdict: Agree
    notes: Correct grouping, size validation and input preservation. Listed tests cover boundary sizes, falsy values and copied
      groups.
- id: J2-P004
  task: js_generation
  split: dev
  stratum: arrays
  input:
    spec:
      name: uniqueBy
      params:
      - name: items
        type: Array<Object>
      - name: key
        type: string
        description: The property to compare on.
      returns:
        type: Array<Object>
      behavior: Return the items with duplicates removed, where two items are duplicates if their key property is the same
        value (compared with ===, except that NaN equals NaN). Keep the first item of each group, in the original order. Items
        without the property count as having the value undefined.
      examples:
      - {args: [[{id: 1, n: a}, {id: 2, n: b}, {id: 1, n: c}], id], returns: [{id: 1, n: a}, {id: 2, n: b}]}
      - {args: [[], id], returns: []}
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function uniqueBy(items, key) {
        const seen = new Set()
        const out = []
        for (const item of items) {
          const value = item[key]
          if (seen.has(value)) continue
          seen.add(value)
          out.push(item)
        }
        return out
      }
    hidden_tests:
    - {name: all unique, args: [[{k: 1}, {k: 2}], k], returns: [{k: 1}, {k: 2}]}
    - {name: all the same, args: [[{k: x, i: 1}, {k: x, i: 2}, {k: x, i: 3}], k], returns: [{k: x, i: 1}]}
    - {name: missing key groups as undefined, args: [[{a: 1}, {b: 2}, {k: 1}], k], returns: [{a: 1}, {k: 1}]}
    - {name: NaN equals NaN, args: [[{k: {$js: NaN}, i: 1}, {k: {$js: NaN}, i: 2}], k], returns: [{k: {$js: NaN}, i: 1}]}
    - {name: string and number differ, args: [[{k: 1}, {k: '1'}], k], returns: [{k: 1}, {k: '1'}]}
    - {name: null and undefined differ, args: [[{k: null}, {}], k], returns: [{k: null}, {}]}
    - name: returns the same objects
      code: |
        const a = { k: 1 }
        assert.ok(fn([a, { k: 1 }], 'k')[0] === a)
    mutation: {"mutants": 5, "killed": 5, "equivalent": 0, "score": 1.0, "survivors": []}
  draft_note: Set semantics (SameValueZero) were chosen so NaN equals NaN; the behavior states it explicitly.
  label:
    status: labelled
    labelled_by: Joel
    verdict: Agree
    notes: Set implements the stated equality, including NaN and signed zero. First occurrences and object identity are preserved.
      A 0-of-0 mutation count provides no mutation evidence.
- id: J2-P005
  task: js_generation
  split: dev
  stratum: numbers
  input:
    spec:
      name: median
      params:
      - name: values
        type: number[]
        description: Finite numbers.
      returns:
        type: number
      behavior: Return the median of values. For an odd count it is the middle value after sorting in ascending numeric order;
        for an even count it is the mean of the two middle values, computed so that it cannot overflow (the median of two
        Number.MAX_VALUE values is Number.MAX_VALUE). Throw a RangeError for an empty array and a TypeError if any value is
        not a finite number, including NaN and the infinities. Do not change values.
      examples:
      - {args: [[3, 1, 2]], returns: 2}
      - {args: [[4, 1, 3, 2]], returns: 2.5}
      - {args: [[]], throws: RangeError}
      constraints:
      - Do not mutate values.
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function median(values) {
        if (values.length === 0) throw new RangeError('median of an empty array')
        if (!values.every((v) => Number.isFinite(v))) throw new TypeError('values must be finite numbers')
        const sorted = [...values].sort((a, b) => a - b)
        const mid = Math.floor(sorted.length / 2)
        if (sorted.length % 2 === 1) return sorted[mid]
        const lo = sorted[mid - 1]
        const hi = sorted[mid]
        const sum = lo + hi
        // Halve the sum when it is finite, so subnormals keep their precision;
        // only when it overflows halve each value first.
        return Number.isFinite(sum) ? sum / 2 : lo / 2 + hi / 2
      }
    hidden_tests:
    - {name: single value, args: [[7]], returns: 7}
    - {name: numeric not lexical sort, args: [[10, 9, 100]], returns: 10}
    - {name: negatives, args: [[-5, -1, -3, -2]], returns: -2.5}
    - {name: duplicates, args: [[2, 2, 2, 9]], returns: 2}
    - {name: two values, args: [[1, 4]], returns: 2.5}
    - {name: decimals, args: [[0.5, 0.25, 0.75]], returns: 0.5}
    - name: does not mutate values
      code: |
        const xs = [3, 1, 2]
        fn(xs)
        assert.equal(xs, [3, 1, 2])
    - name: no overflow at the largest value
      code: |
        assert.equal(fn([Number.MAX_VALUE, Number.MAX_VALUE]), Number.MAX_VALUE)
    - name: opposite extremes
      code: |
        assert.equal(fn([-Number.MAX_VALUE, Number.MAX_VALUE]), 0)
        assert.equal(fn([-Number.MAX_VALUE, -Number.MAX_VALUE, 1]), -Number.MAX_VALUE)
    - name: no underflow at the smallest value
      code: |
        assert.equal(fn([Number.MIN_VALUE, Number.MIN_VALUE]), Number.MIN_VALUE)
        assert.equal(fn([3 * Number.MIN_VALUE, 3 * Number.MIN_VALUE]), 3 * Number.MIN_VALUE)
        assert.equal(fn([Number.MIN_VALUE, 3 * Number.MIN_VALUE]), 2 * Number.MIN_VALUE)
    - {name: NaN, args: [[1, {$js: NaN}]], throws: TypeError}
    - {name: infinity, args: [[1, {$js: Infinity}]], throws: TypeError}
    - {name: a string, args: [[1, '2']], throws: TypeError}
    mutation: {"mutants": 25, "killed": 25, "equivalent": 0, "score": 1.0, "survivors": []}
  draft_note: 'Corrected per Joel''s review: Domain is finite numbers (TypeError otherwise); the even-count mean halves the sum, or each value
      when the sum overflows; overflow, underflow and extreme tests added.'
  label:
    status: draft
    labelled_by: null
    notes: null
    review:
      by: Joel
      verdict: Correct
      notes: The present mean overflows to Infinity for two Number.MAX_VALUE inputs, although their median is finite. Existing
        listed tests pass but miss this defect.
      requested_changes: Define the supported numeric domain explicitly, including NaN and infinities. For finite values,
        use an overflow-safe even-count mean. Add [Number.MAX_VALUE, Number.MAX_VALUE] -> Number.MAX_VALUE and opposite-sign
        extremes.
      applied: Domain is finite numbers (TypeError otherwise); the even-count mean halves the sum, or each value when the sum overflows; overflow, underflow and extreme tests
        added.
- id: J2-P006
  task: js_generation
  split: dev
  stratum: numbers
  input:
    spec:
      name: formatMoney
      params:
      - name: cents
        type: number
        description: A whole number of cents within the safe-integer range, possibly negative.
      returns:
        type: string
      behavior: Format an amount in cents as dollars with a $ sign, a comma between each group of three digits, and exactly
        two decimals. A negative amount starts with a minus sign before the $ sign. Throw a TypeError if cents is not a safe
        integer (Number.isSafeInteger), since larger numbers cannot be formatted exactly.
      examples:
      - {args: [123456], returns: '$1,234.56'}
      - {args: [-5], returns: -$0.05}
      - {args: [1.5], throws: TypeError}
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function formatMoney(cents) {
        if (!Number.isSafeInteger(cents)) throw new TypeError('cents must be a safe integer')
        const sign = cents < 0 ? '-' : ''
        const abs = Math.abs(cents)
        const dollars = String(Math.floor(abs / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
        const rest = String(abs % 100).padStart(2, '0')
        return `${sign}$${dollars}.${rest}`
      }
    hidden_tests:
    - {name: zero, args: [0], returns: $0.00}
    - {name: under a dollar, args: [99], returns: $0.99}
    - {name: exact dollars, args: [100000], returns: '$1,000.00'}
    - {name: no comma under a thousand, args: [99999], returns: $999.99}
    - {name: millions, args: [123456789], returns: '$1,234,567.89'}
    - {name: negative with commas, args: [-100000001], returns: '-$1,000,000.01'}
    - {name: negative zero, args: [{$js: '-0'}], returns: $0.00}
    - {name: string, args: ['100'], throws: TypeError}
    - {name: NaN, args: [{$js: NaN}], throws: TypeError}
    - {name: largest safe integer, args: [9007199254740991], returns: '$90,071,992,547,409.91'}
    - {name: smallest safe integer, args: [-9007199254740991], returns: '-$90,071,992,547,409.91'}
    - {name: first unsafe integer, args: [9007199254740992], throws: TypeError}
    - {name: huge number, args: [1.0e+23], throws: TypeError}
    mutation: {"mutants": 10, "killed": 10, "equivalent": 0, "score": 1.0, "survivors": []}
  draft_note: 'Corrected per Joel''s review: Took the first option: safe integers only, checked with Number.isSafeInteger; boundary tests
      added. Negative zero formats as $0.00 with no sign, which the behavior implies but does not say.'
  label:
    status: draft
    labelled_by: null
    notes: null
    review:
      by: Joel
      verdict: Correct
      notes: Number.isInteger accepts very large Numbers. formatMoney(1e23) produces incorrect dollars/cents. Existing small-value
        tests do not establish correctness across the accepted domain.
      requested_changes: Specify safe-integer cents and reject other inputs with TypeError using Number.isSafeInteger. Add
        +/-Number.MAX_SAFE_INTEGER and unsafe integers. Alternatively retain all integer Numbers and implement exact conversion
        of the represented integer.
      applied: 'Took the first option: safe integers only, checked with Number.isSafeInteger; boundary tests added.'
- id: J2-P007
  task: js_generation
  split: dev
  stratum: objects
  input:
    spec:
      name: groupBy
      params:
      - name: items
        type: Array<Object>
      - name: key
        type: string
      returns:
        type: Object<string, Array<Object>>
      behavior: Group items by the string value of their key property. Return a plain object whose keys are those values,
        in order of first appearance, and whose values are arrays of the items in their original order. Any key name must
        work, including names such as constructor or toString.
      examples:
      - {args: [[{t: a, v: 1}, {t: b, v: 2}, {t: a, v: 3}], t], returns: {a: [{t: a, v: 1}, {t: a, v: 3}], b: [{t: b, v: 2}]}}
  expected:
    route: js_generation
    behavior: ask
    reference_solution: null
    hidden_tests: []
    open_questions:
    - Plain objects put integer-like keys such as "2" before other keys. Is that order acceptable, or must the result keep
      first-appearance order exactly (for example as a Map)?
    - Must a key named __proto__ become an ordinary own group?
  draft_note: Labelled ask by Joel. J2-P022 is the same function with the decision settled.
  label:
    status: labelled
    labelled_by: Joel
    verdict: Correct
    notes: groupBy([{t:'__proto__'}], 't') changes the result prototype and yields no own group key. Numeric keys also contradict
      unconditional first-appearance order. Both are missed by the listed tests.
    requested_changes: 'Resolve the first-appearance requirement for integer-like keys: plain-object enumeration sorts them
      numerically. Either document that exception or choose an ordered return type. Preserve plain-object semantics if retained,
      create __proto__ as an own data property with Object.defineProperty, and add __proto__ plus [''2'',''1''] key tests.'
