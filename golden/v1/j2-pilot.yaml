- id: J2-P026
  task: js_generation
  split: dev
  stratum: errors
  input:
    spec:
      name: parsePercent
      params:
      - name: text
        type: string
        description: Such as "12.5%".
      returns:
        type: number
        description: A fraction, so "50%" is 0.5.
      behavior: 'Parse a percentage and return it as a fraction. The form is: optional spaces, an optional minus sign, one
        or more digits, optionally a dot followed by one or more digits, a % sign, then optional spaces. So a leading dot
        (".5%") or a trailing dot ("5.%") is not allowed, leading zeros are allowed ("05%" is 0.05), and there are no spaces
        inside the percentage. Throw a TypeError if text is not a string, and a SyntaxError if it is not in this form. Throw
        a RangeError if the value is below -100% or above 100%.'
      examples:
      - {args: [50%], returns: 0.5}
      - {args: [' -12.5% '], returns: -0.125}
      - {args: [120%], throws: RangeError}
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function parsePercent(text) {
        if (typeof text !== 'string') throw new TypeError('text must be a string')
        const m = /^\s*(-?\d+(?:\.\d+)?)%\s*$/.exec(text)
        if (!m) throw new SyntaxError(`not a percentage: ${text}`)
        const value = Number(m[1])
        if (value < -100 || value > 100) throw new RangeError('percentage out of range')
        return value / 100
      }
    hidden_tests:
