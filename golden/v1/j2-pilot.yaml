  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function mergeIntervals(intervals) {
        const sorted = intervals.map(([a, b]) => [a, b]).sort((x, y) => x[0] - y[0])
        const out = []
        for (const [a, b] of sorted) {
          const last = out[out.length - 1]
          if (last && a <= last[1]) last[1] = Math.max(last[1], b)
          else out.push([a, b])
        }
        return out
      }
    hidden_tests:
