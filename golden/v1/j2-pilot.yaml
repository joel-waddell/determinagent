    - 'line 8 col 67: > -> >='
    - 'line 8 col 78: 1 -> 0'
    - 'line 8 col 82: 0 -> 1'
    equivalent_note: V8's Array.prototype.sort (Node) only distinguishes a negative result from a non-negative one, so these
      changes to the positive and zero branches (including swapping them) do not change the order. The 400-item test with
