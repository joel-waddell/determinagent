- id: J2-P027
  task: js_generation
  split: dev
  stratum: immutability
  input:
    spec:
      name: sortBy
      params:
      - name: items
        type: Array<Object>
      - name: key
        type: string
      returns:
        type: Array<Object>
      behavior: Return a new array of the items sorted by their key property in ascending order. Every item must have the
        key, and in one call the keys must be all numbers (none of them NaN) or all strings; throw a TypeError otherwise.
        Numbers compare numerically and strings by UTF-16 code unit order (the default string comparison). Items with equal
        keys keep their original order. Do not change items.
      examples:
      - {args: [[{n: 3}, {n: 1}, {n: 2}], n], returns: [{n: 1}, {n: 2}, {n: 3}]}
      constraints:
      - Do not mutate items.
      - The sort must be stable.
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function sortBy(items, key) {
        const types = new Set(items.map((item) => (Object.hasOwn(item, key) ? typeof item[key] : 'missing')))
        const [type] = types
        if (types.size > 1 || (items.length > 0 && type !== 'number' && type !== 'string')) {
          throw new TypeError('keys must be all numbers or all strings')
        }
        if (items.some((item) => Number.isNaN(item[key]))) throw new TypeError('keys must not be NaN')
        return [...items].sort((a, b) => (a[key] < b[key] ? -1 : a[key] > b[key] ? 1 : 0))
      }
    hidden_tests:
    - {name: numbers not lexical, args: [[{n: 10}, {n: 9}, {n: 100}], n], returns: [{n: 9}, {n: 10}, {n: 100}]}
    - {name: strings by code unit, args: [[{s: b}, {s: B}, {s: a}], s], returns: [{s: B}, {s: a}, {s: b}]}
    - {name: stable, args: [[{k: 1, i: 1}, {k: 0, i: 2}, {k: 1, i: 3}, {k: 0, i: 4}], k], returns: [{k: 0, i: 2}, {k: 0, i: 4},
        {k: 1, i: 1}, {k: 1, i: 3}]}
    - {name: empty, args: [[], k], returns: []}
    - {name: negatives, args: [[{n: -1}, {n: -10}, {n: 0}], n], returns: [{n: -10}, {n: -1}, {n: 0}]}
    - name: stable on a longer input
      code: |
        const xs = Array.from({ length: 30 }, (_, i) => ({ k: (i * 7) % 3, i }))
        const out = fn(xs, 'k')
        const want = [...xs].sort((a, b) => a.k - b.k || a.i - b.i)
        assert.equal(out, want)
    - name: does not mutate items
      code: |
        const xs = [{ n: 2 }, { n: 1 }]
        const out = fn(xs, 'n')
        assert.equal(xs, [{ n: 2 }, { n: 1 }])
        assert.ok(out !== xs, 'must return a new array')
    - {name: mixed types, args: [[{k: '2'}, {k: 10}, {k: '11'}], k], throws: TypeError}
    - {name: missing key, args: [[{k: 1}, {}], k], throws: TypeError}
    - {name: NaN key, args: [[{k: 1}, {k: {$js: NaN}}], k], throws: TypeError}
    - {name: boolean keys, args: [[{k: true}, {k: false}], k], throws: TypeError}
    - {name: one item with a boolean key, args: [[{k: true}], k], throws: TypeError}
    - {name: one item without the key, args: [[{}], k], throws: TypeError}
    - name: stable on a long input with runs
      code: |
        const xs = Array.from({ length: 400 }, (_, i) => ({ k: i < 200 ? Math.floor(i / 20) : Math.floor((i - 200) / 15), i }))
        const out = fn(xs, 'k')
        const want = [...xs].sort((a, b) => a.k - b.k || a.i - b.i)
        assert.equal(out, want)
    equivalent_mutants:
