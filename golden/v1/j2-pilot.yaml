- id: J2-P024
  task: js_generation
  split: dev
  stratum: dates
  input:
    spec:
      name: addBusinessDays
      params:
      - name: date
        type: string
        description: A calendar date as YYYY-MM-DD.
      - name: days
        type: number
        description: A whole number of business days, zero or more.
      returns:
        type: string
      behavior: Return the date that is days business days after date, as YYYY-MM-DD. Business days are Monday to Friday;
        there are no holidays. If date falls on a Saturday or Sunday, first move it to the following Monday, then count days
        business days from that Monday. So with days 0 a weekend date gives the next Monday, and a Saturday plus 1 gives the
        Tuesday. Work in UTC. Throw a RangeError if days is negative or not an integer.
      examples:
      - {args: ['2026-03-06', 1], returns: '2026-03-09'}
      - {args: ['2026-03-02', 3], returns: '2026-03-05'}
      - {args: ['2026-03-07', 0], returns: '2026-03-09'}
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      const isWeekend = (d) => d.getUTCDay() === 0 || d.getUTCDay() === 6

      export function addBusinessDays(date, days) {
        if (!Number.isInteger(days) || days < 0) throw new RangeError('days must be a whole number of zero or more')
        const d = new Date(`${date}T00:00:00Z`)
        while (isWeekend(d)) d.setUTCDate(d.getUTCDate() + 1)
        let left = days
        while (left > 0) {
          d.setUTCDate(d.getUTCDate() + 1)
          if (!isWeekend(d)) left -= 1
        }
        return d.toISOString().slice(0, 10)
      }
    hidden_tests:
    - {name: zero on a weekday, args: ['2026-03-04', 0], returns: '2026-03-04'}
    - {name: zero on a Sunday, args: ['2026-03-08', 0], returns: '2026-03-09'}
    - {name: start on Saturday plus one, args: ['2026-03-07', 1], returns: '2026-03-10'}
    - {name: across a month end, args: ['2026-01-30', 1], returns: '2026-02-02'}
    - {name: across a year end, args: ['2026-12-31', 2], returns: '2027-01-04'}
    - {name: leap day, args: ['2028-02-28', 1], returns: '2028-02-29'}
    - {name: two weeks, args: ['2026-03-02', 10], returns: '2026-03-16'}
    - {name: negative, args: ['2026-03-02', -1], throws: RangeError}
    - {name: fractional, args: ['2026-03-02', 0.5], throws: RangeError}
    mutation: {"mutants": 26, "killed": 26, "equivalent": 0, "score": 1.0, "survivors": []}
  draft_note: 'Clarified from J2-P009: the weekend-to-Monday step is now stated, so Saturday + 1 = Tuesday follows from the
    spec.'
