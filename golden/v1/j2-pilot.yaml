      returns:
        type: Array<[number, number]>
      behavior: Merge overlapping intervals and return them sorted by start. Intervals that only touch, such as [1, 2] and
        [2, 3], are merged. Do not change the input.
      examples:
      - {args: [[[1, 3], [2, 6], [8, 10]]], returns: [[1, 6], [8, 10]]}
      - {args: [[[5, 6], [1, 2], [2, 3]]], returns: [[1, 3], [5, 6]]}
