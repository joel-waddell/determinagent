- id: J2-P016
  task: js_generation
  split: dev
  stratum: async
  input:
    spec:
      name: retry
      async: true
      params:
      - name: task
        type: 'function(): Promise<*>'
        description: An async function to call.
      - name: attempts
        type: number
        description: The maximum number of calls, at least 1.
      returns:
        type: Promise<*>
      behavior: Call task until it resolves, at most attempts times, one call after another with no delay. Resolve with the
        first value it resolves with. If every call rejects, reject with the error from the last call. Throw a RangeError
        (as a rejection) if attempts is not an integer of at least 1, without calling task.
      examples: []
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export async function retry(task, attempts) {
        if (!Number.isInteger(attempts) || attempts < 1) throw new RangeError('attempts must be an integer of at least 1')
        let last
        for (let i = 0; i < attempts; i++) {
          try {
            return await task()
          } catch (e) {
            last = e
          }
        }
        throw last
      }
    hidden_tests:
    - name: first call succeeds
      code: |
        let calls = 0
        const v = await fn(async () => { calls++; return 'ok' }, 3)
        assert.equal([v, calls], ['ok', 1])
    - name: succeeds on the third call
      code: |
        let calls = 0
        const v = await fn(async () => { calls++; if (calls < 3) throw new Error('no'); return calls }, 5)
        assert.equal(v, 3)
    - name: rejects with the last error
      code: |
        let calls = 0
        await assert.rejects(fn(async () => { calls++; throw new Error(`fail ${calls}`) }, 3), 'fail 3')
        assert.equal(calls, 3)
    - name: calls one after another
      code: |
        let running = 0
        let most = 0
        await assert.rejects(fn(async () => { running++; most = Math.max(most, running); await null; running--; throw new Error('x') }, 4), 'x')
        assert.equal(most, 1)
    - name: bad attempts rejects without calling
      code: |
        let calls = 0
        await assert.rejects(fn(async () => { calls++ }, 0), 'RangeError')
        assert.equal(calls, 0)
    - name: returns a promise even for bad attempts
      code: |
        const p = fn(async () => 1, 1.5)
        assert.ok(p instanceof Promise)
        await assert.rejects(p, 'RangeError')
    - name: one attempt is enough
      code: |
        assert.equal(await fn(async () => 7, 1), 7)
    - name: resolved undefined is a success
      code: |
        let calls = 0
        const v = await fn(async () => { calls++ }, 3)
        assert.equal([v, calls], [undefined, 1])
    mutation: {"mutants": 10, "killed": 10, "equivalent": 0, "score": 1.0, "survivors": []}
  draft_note: No visible examples, because an example cannot pass a function. The spec relies on the behavior text.
  label:
    status: labelled
    labelled_by: Joel
    verdict: Agree
    notes: Sequential await, early success, last-error rejection and invalid-attempt rejection are correct. Listed async tests
      pass, including undefined as a successful result.
