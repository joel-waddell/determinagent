- id: J2-P010
  task: js_generation
  split: dev
  stratum: dates
  input:
    spec:
      name: ageOn
      params:
      - name: birthDate
        type: string
        description: A valid calendar date, written as zero-padded YYYY-MM-DD.
      - name: onDate
        type: string
        description: A valid calendar date, written as zero-padded YYYY-MM-DD.
      returns:
        type: number
      behavior: Return the person's age in whole years on onDate. Both dates are valid calendar dates written as zero-padded
        YYYY-MM-DD; other formats are out of scope. The age goes up on the birthday itself. Someone born on 29 February has
        their birthday on 1 March in years that are not leap years. Throw a RangeError if onDate is before birthDate.
      examples:
      - {args: ['2000-05-15', '2026-05-14'], returns: 25}
      - {args: ['2000-05-15', '2026-05-15'], returns: 26}
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      const parts = (s) => s.split('-').map(Number)

      export function ageOn(birthDate, onDate) {
        if (onDate < birthDate) throw new RangeError('onDate is before birthDate')
        const [by, bm, bd] = parts(birthDate)
        const [oy, om, od] = parts(onDate)
        const hadBirthday = om > bm || (om === bm && od >= bd)
        return oy - by - (hadBirthday ? 0 : 1)
      }
    hidden_tests:
    - {name: same day, args: ['2026-01-01', '2026-01-01'], returns: 0}
    - {name: day before first birthday, args: ['2025-03-10', '2026-03-09'], returns: 0}
    - {name: leap-day birthday in a non-leap year, args: ['2000-02-29', '2026-02-28'], returns: 25}
    - {name: leap-day birthday on 1 March, args: ['2000-02-29', '2026-03-01'], returns: 26}
    - {name: leap-day birthday in a leap year, args: ['2000-02-29', '2028-02-29'], returns: 28}
    - {name: end of year, args: ['1990-12-31', '2026-12-30'], returns: 35}
    - {name: later month earlier day, args: ['2000-01-29', '2026-02-15'], returns: 26}
    - {name: same month later day, args: ['2000-02-10', '2026-02-20'], returns: 26}
    - {name: same month earlier day, args: ['2000-06-20', '2026-06-10'], returns: 25}
    - {name: leap-day birthday in 2100, args: ['2000-02-29', '2100-02-28'], returns: 99}
    - {name: onDate before birthDate, args: ['2026-01-02', '2026-01-01'], throws: RangeError}
    mutation: {"mutants": 13, "killed": 13, "equivalent": 0, "score": 1.0, "survivors": []}
  draft_note: 'Corrected per Joel''s review: Stated the zero-padded YYYY-MM-DD precondition in the spec; calculation and tests unchanged.
      In a non-leap year there is no 29 February, so "on or after the birthday" already means 1 March and the reference needs
      no special case. String comparison of ISO dates is used for the order check.'
  label:
    status: draft
    labelled_by: null
    notes: null
    review:
      by: Joel
      verdict: Correct
      notes: The prior Agree verdict assumed ISO dates. Without padding, ageOn('2000-5-15', '2000-10-01') throws RangeError
        even though the second date is later.
      requested_changes: Specify valid, zero-padded YYYY-MM-DD dates as the input precondition. Keep the existing calculation
        and leap-day tests. If other date formats are allowed, parse and compare year, month and day numerically and test
        the accepted formats.
      applied: Stated the zero-padded YYYY-MM-DD precondition in the spec; calculation and tests unchanged.
