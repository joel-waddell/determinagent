- id: J2-P025
  task: js_generation
  split: dev
  stratum: algorithms
  input:
    spec:
      name: topWords
      params:
      - name: text
        type: string
      - name: k
        type: number
        description: A whole number of zero or more.
      returns:
        type: string[]
      behavior: Return the k most frequent words in text, most frequent first. A word is a run of the letters a to z after
        lower-casing; everything else separates words. Break ties alphabetically. Return fewer than k words if there are fewer
        distinct words. Throw a RangeError if k is negative or not an integer.
      examples:
      - {args: [the cat and the hat, 2], returns: [the, and]}
      - {args: ['', 3], returns: []}
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function topWords(text, k) {
        if (!Number.isInteger(k) || k < 0) throw new RangeError('k must be a whole number of zero or more')
        const counts = new Map()
        for (const w of text.toLowerCase().match(/[a-z]+/g) ?? []) counts.set(w, (counts.get(w) ?? 0) + 1)
        return [...counts.entries()]
          .sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1))
          .slice(0, k)
          .map(([w]) => w)
      }
    hidden_tests:
    - {name: case folding, args: [Dog dog DOG cat, 1], returns: [dog]}
    - {name: tie alphabetical, args: [b a c, 3], returns: [a, b, c]}
    - {name: fewer distinct words, args: [x x, 5], returns: [x]}
    - {name: k zero, args: [a b, 0], returns: []}
    - {name: punctuation and digits separate, args: ['it''s 4x4, it''s', 2], returns: [it, s]}
    - {name: prototype names are words, args: [constructor toString constructor valueOf, 2], returns: [constructor, tostring]}
    - {name: constructor is an ordinary word, args: [constructor constructor constructor a, 1], returns: [constructor]}
    - {name: frequency before alphabet, args: [z z z a a b, 2], returns: [z, a]}
    - {name: ties after frequency, args: [d c b a d c b d c d, 4], returns: [d, c, b, a]}
    - {name: tie order is not insertion order, args: [pear fig apple kiwi fig apple pear kiwi, 3], returns: [apple, fig, kiwi]}
    - {name: negative k, args: [a b c, -1], throws: RangeError}
    - {name: fractional k, args: [a b c, 1.5], throws: RangeError}
    - {name: NaN k, args: [a b c, {$js: NaN}], throws: RangeError}
    equivalent_mutants:
    - 'line 4 col 55: ?? -> ||'
    - 'line 4 col 91: ?? -> ||'
    - 'line 4 col 94: 0 -> 1'
    - 'line 6 col 42: < -> <='
    - 'line 6 col 56: 1 -> 0'
    equivalent_note: Counts are never 0 and match() never returns an empty array, so ?? and || agree. Starting counts at 1
      shifts every count equally. Words are distinct, so < and <= agree, and the sort only uses the sign of a negative result.
