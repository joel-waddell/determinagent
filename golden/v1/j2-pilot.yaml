- id: J2-P023
  task: js_generation
  split: dev
  stratum: objects
  input:
    spec:
      name: getPath
      params:
      - name: obj
        type: '*'
      - name: path
        type: string
        description: Property names separated by dots, such as "a.b.c". Every dot separates two steps, so a key that contains
          a dot cannot be reached. Array indexes are written the same way, as "list.0".
      - name: fallback
        type: '*'
      returns:
        type: '*'
      behavior: Follow path through obj and return the value found. Each step follows an own property only, never an inherited
        one (so "a.toString" is missing). Return fallback if any step is missing, or if a step reaches null or undefined before
        the end. A value that exists but is undefined also gives fallback. An empty path returns obj itself.
      examples:
      - {args: [{a: {b: 2}}, a.b, 0], returns: 2}
      - {args: [{a: {}}, a.b.c, none], returns: none}
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function getPath(obj, path, fallback) {
        if (path === '') return obj
        let cur = obj
        for (const part of path.split('.')) {
          if (cur === null || cur === undefined || !Object.hasOwn(cur, part)) return fallback
          cur = cur[part]
        }
        return cur === undefined ? fallback : cur
      }
    hidden_tests:
    - {name: array index, args: [{list: [a, b]}, list.1, null], returns: b}
    - {name: empty path, args: [{a: 1}, '', null], returns: {a: 1}}
    - {name: null on the way, args: [{a: null}, a.b, x], returns: x}
    - {name: null at the end is a value, args: [{a: null}, a, x], returns: null}
    - {name: falsy values are values, args: [{a: {z: 0, f: false, s: ''}}, a.z, x], returns: 0}
    - {name: false is a value, args: [{a: {f: false}}, a.f, x], returns: false}
    - {name: explicit undefined gives fallback, args: [{a: {$js: undefined}}, a, x], returns: x}
    - {name: obj itself null, args: [null, a, x], returns: x}
    - {name: string length, args: [{s: abc}, s.length, 0], returns: 3}
    - {name: inherited property is missing, args: [{a: {}}, a.toString, x], returns: x}
    - {name: inherited on an array, args: [{list: [1]}, list.map, x], returns: x}
    - {name: dotted key cannot be reached, args: [{a.b: 1}, a.b, x], returns: x}
    - {name: dots separate even next to a dotted key, args: [{a: {b: 1}, a.b: 2}, a.b, x], returns: 1}
