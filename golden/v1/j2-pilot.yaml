- id: J2-P012
  task: js_generation
  split: dev
  stratum: validation
  input:
    spec:
      name: isValidLuhn
      params:
      - name: number
        type: string
        description: Digits, possibly with single spaces between groups.
      returns:
        type: boolean
      behavior: Return true if number passes the Luhn checksum. Spaces are ignored. Anything other than digits and spaces
        makes it invalid, and so does having fewer than two digits.
      examples:
      - {args: [4539 3195 0343 6467], returns: true}
      - {args: [8273 1232 7352 0569], returns: false}
  expected:
    route: js_generation
    behavior: draft
    reference_solution: |
      export function isValidLuhn(number) {
        if (!/^[\d ]*$/.test(number)) return false
        const digits = number.replaceAll(' ', '')
        if (digits.length < 2) return false
        let sum = 0
        for (let i = 0; i < digits.length; i++) {
          let d = Number(digits[digits.length - 1 - i])
          if (i % 2 === 1) {
            d *= 2
            if (d > 9) d -= 9
          }
          sum += d
        }
        return sum % 10 === 0
      }
    hidden_tests:
    - {name: zero zero, args: ['00'], returns: true}
    - {name: one digit, args: ['0'], returns: false}
    - {name: empty, args: [''], returns: false}
    - {name: letters, args: [4539 3195 0343 646a], returns: false}
    - {name: dashes, args: [4539-3195-0343-6467], returns: false}
    - {name: no spaces, args: ['79927398713'], returns: true}
    - {name: one digit off, args: ['79927398710'], returns: false}
    - {name: doubled digit over nine, args: ['59'], returns: true}
    - {name: odd length, args: [091], returns: true}
    - {name: only spaces, args: ['   '], returns: false}
    equivalent_mutants:
    - 'line 10 col 13: > -> >='
    - 'line 12 col 9: += -> -='
    equivalent_note: A doubled digit is even, so it is never exactly 9. Subtracting instead of adding gives the negated sum,
      which is a multiple of 10 exactly when the sum is.
    mutation: {"mutants": 36, "killed": 34, "equivalent": 2, "score": 1.0, "survivors": []}
  draft_note: null
  label:
    status: labelled
    labelled_by: Joel
    verdict: Agree
    notes: Correct Luhn parity, doubling, reduction, minimum length and literal-space handling. Listed valid and invalid cases
      pass.
