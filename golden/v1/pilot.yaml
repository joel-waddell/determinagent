- id: T3-P001
  task: gherkin_requirements
  split: dev
  stratum: happy+negative
  input:
    requirement: 'As a customer, I want to reset my password by email, so that I can regain access. Acceptance: a reset link
      is emailed to a registered address; the link expires after 1 hour.'
  expected:
    route: gherkin_requirements
    behavior: draft
    reference_feature: |
      Feature: Password reset by email

        Scenario: Registered customer requests a reset
          Given a customer registered with "ana@example.com"
          When the customer requests a password reset for "ana@example.com"
          Then a reset link is emailed to "ana@example.com"

        Scenario: Reset link has expired
          Given a reset link issued 61 minutes ago
          When the customer opens the reset link
          Then the customer is told the link has expired
    acceptance_checks:
    - Reset email sent to a registered address
    - Link older than 1 hour is rejected
  draft_note: null
  label:
    status: draft
    labelled_by: null
    notes: null
