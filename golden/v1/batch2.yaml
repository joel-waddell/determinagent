  split: heldout
  stratum: validation
  input:
    requirement:
      role: new customer
      capability: to register with my email address
      benefit: I can sign in later
      acceptance_criteria:
      - an address without an @ is refused with a message
      - a well-formed address is accepted
  expected:
    route: gherkin_requirements
    behavior: draft
    reference_feature: |
      Feature: Email address at registration

        Scenario: Well-formed address is accepted
          Given no account exists for "sam@example.com"
          When the new customer registers with "sam@example.com"
          Then the registration is accepted

        Scenario: Address without an at sign is refused
          Given no account exists for "sam.example.com"
          When the new customer registers with "sam.example.com"
          Then the registration is refused
          And the customer sees a message that the email address is not valid
    acceptance_checks:
    - Well-formed address accepted
    - Address without @ refused with a message
  draft_note: null
  label:
    status: draft
    labelled_by: null
    notes: null
