# RuleSpeak cases shared by the Python and JavaScript cores, and the seed of
# the 0.2 golden set. Each case keeps two expectations apart:
#
#   checker    what the deterministic checker must return. Asserted by the
#              tests in both cores (only the keys present are compared; codes
#              must match exactly, in any order).
#   rulespeak  the RuleSpeak assessment a domain expert would give: form
#              (conforms | needs_revision | undetermined), fidelity, and the
#              RS ids that justify it. Not asserted by the checker tests; it
#              labels the agent and SLM evaluations, and shows where the
#              checker and RuleSpeak disagree. label_status stays "draft"
#              until the domain expert labels the case.
#   reason     why, in one line. origin names a traced example it came from.
cases:
