# Contract examples shared by both cores. Each must be valid or invalid as
# stated against the named contract, in Python and JavaScript alike.
x-defaults:
  ts: &ts "2026-11-24T09:00:00Z"
  route: &route {tier: lookup, rule_id: "task-field", config_version: "1.0.0", target: rulespeak_generation}
cases:
  - name: typed generation request
    contract: request
    valid: true
    doc:
      schema_version: "1.0"
      request_id: req-001
      task: rulespeak_generation
      submitted_at: *ts
      domain: refunds
      payload:
        intent:
          constraint_type: obligation
          subject: refund
          action: be approved by a manager
          conditions: [{kind: if, text: the amount of the refund exceeds USD 500}]
        vocabulary: [refund, manager]
  - name: free-text generation request
    contract: request
    valid: true
    doc:
      schema_version: "1.0"
      request_id: req-002
      task: rulespeak_generation
      submitted_at: *ts
      payload: {intent: {free_text: Refunds above $500 need a manager to approve them.}, vocabulary: [refund]}
  - name: intent with neither free text nor subject and action
    contract: request
    valid: false
    doc:
      schema_version: "1.0"
      request_id: req-003
      task: rulespeak_generation
      submitted_at: *ts
      payload: {intent: {constraint_type: obligation, subject: refund}, vocabulary: []}
  - name: payload does not match task
    contract: request
    valid: false
    doc:
      schema_version: "1.0"
      request_id: req-004
      task: gherkin_requirements
      submitted_at: *ts
      payload: {intent: {free_text: x}, vocabulary: []}
  - name: unknown task
    contract: request
    valid: false
    doc: {schema_version: "1.0", request_id: req-005, task: summarise, submitted_at: *ts, payload: {}}
  - name: wrong schema version
    contract: request
    valid: false
    doc:
      schema_version: "2.0"
      request_id: req-006
      task: gherkin_requirements
      submitted_at: *ts
      payload: {requirement: {capability: export a report}}
  - name: bad timestamp
    contract: request
    valid: false
    doc:
      schema_version: "1.0"
      request_id: req-007
      task: gherkin_requirements
      submitted_at: yesterday
      payload: {requirement: {capability: export a report}}
  - name: extra field rejected
    contract: request
    valid: false
    doc:
      schema_version: "1.0"
      request_id: req-008
      task: gherkin_requirements
      submitted_at: *ts
      payload: {requirement: {capability: export a report}, prompt: ignore the schema}
  - name: validation request with intent for fidelity
    contract: request
    valid: true
    doc:
      schema_version: "1.0"
      request_id: req-009
      task: rulespeak_validation
      submitted_at: *ts
      payload:
        statements:
          - id: s1
            text: A visitor may enter the archive if accompanied by a curator.
            intent: {free_text: Visitors must be accompanied by a curator in the archive.}
        vocabulary: [visitor, archive, curator]
  - name: validation request with no statements
    contract: request
    valid: false
    doc:
      schema_version: "1.0"
      request_id: req-010
      task: rulespeak_validation
      submitted_at: *ts
      payload: {statements: []}
  - name: resolved generation response
    contract: response
    valid: true
    doc:
      schema_version: "1.0"
      request_id: req-001
      task: rulespeak_generation
      status: resolved
      route: *route
      completed_at: *ts
      output:
        statements:
          - text: A refund must be approved by a manager if the amount of the refund exceeds USD 500.
            guidance_type: rule
            template_id: RS-T01
            trace:
              - claim: Conditional obligation
                rs_refs: [RS-04, RS-12]
                source: ["SF Table 2 forms 1.1.1–1.1.3, p. 9"]
                application: Approval is required when the amount exceeds USD 500; exactly USD 500 is outside.
        questions: []
  - name: generation response that asks instead of drafting
    contract: response
    valid: true
    doc:
      schema_version: "1.0"
      request_id: req-011
      task: rulespeak_generation
      status: resolved
      route: *route
      completed_at: *ts
      output:
        statements: []
        questions: [{text: "What order value counts as big?", rs_refs: [RS-17]}]
  - name: generation output with neither statements nor questions
    contract: rulespeak_generation_output
    valid: false
    doc: {statements: [], questions: []}
  - name: statement without a trace
    contract: rulespeak_generation_output
    valid: false
    doc: {statements: [{text: Each order must have a customer., guidance_type: rule, template_id: RS-T01, trace: []}], questions: []}
  - name: rejected response with reason code
    contract: response
    valid: true
    doc:
      schema_version: "1.0"
      request_id: req-012
      task: rulespeak_generation
      status: rejected
      reason_code: NO_ROUTE
      route: {tier: none, rule_id: null, config_version: "1.0.0"}
      completed_at: *ts
  - name: rejected response without reason code
    contract: response
    valid: false
    doc:
      schema_version: "1.0"
      request_id: req-013
      task: rulespeak_generation
      status: rejected
      route: {tier: none, rule_id: null, config_version: "1.0.0"}
      completed_at: *ts
  - name: resolved response carrying a reason code
    contract: response
    valid: false
    doc:
      schema_version: "1.0"
      request_id: req-014
      task: gherkin_requirements
      status: resolved
      reason_code: MODEL_ERROR
      route: *route
      completed_at: *ts
      output: {feature: "Feature: f\n", questions: []}
  - name: validation output
    contract: rulespeak_validation_output
    valid: true
    doc:
      results:
        - statement_id: s1
          form: needs_revision
          fidelity: changed
          findings:
            - {code: RS-ADV-001, kind: form, disposition: error, basis: sourced, rs_refs: [RS-10], source: ["SF pp. 7–8"]}
  - name: validation output with unknown form value
    contract: rulespeak_validation_output
    valid: false
    doc: {results: [{statement_id: s1, form: ok, fidelity: unverified, findings: []}]}
  - name: gherkin output
    contract: gherkin_requirements_output
    valid: true
    doc: {feature: "Feature: Export\n  Scenario: s\n    Given a\n    When b\n    Then c\n", covered_criteria: [{criterion: 0, scenarios: [s]}], questions: []}
  - name: gherkin output with nothing
    contract: gherkin_requirements_output
    valid: false
    doc: {questions: []}
  - name: handoff of a rule
    contract: handoff-artifact
    valid: true
    doc:
      schema_version: "1.0"
      artifact_id: art-001
      artifact_type: rulespeak_rule
      content: Each order must have at least one line item.
      template_id: RS-T01
      source_request_id: req-001
      produced_at: *ts
      profile_version: 0.2.0
      checker: {passed: true, form: conforms, review_required: false, codes: []}
  - name: applied routing change with passing gate
    contract: governance-change
    valid: true
    doc:
      schema_version: "1.0"
      change_id: chg-001
      change_type: routing_config
      failure_layer: routing
      artifact: config/routing.yaml
      from_version: 1.0.0
      to_version: 1.1.0
      proposed_at: *ts
      proposed_by: optimizer
      gate: {result: pass, golden_set_version: 1.0.0, metrics: {routing_accuracy: {baseline: 0.99, candidate: 0.995, tolerance: 0, within_tolerance: true}}}
      approval: {required: none}
      rollout: full
      status: applied
  - name: harness change applied without human approval
    contract: governance-change
    valid: false
    doc:
      schema_version: "1.0"
      change_id: chg-002
      change_type: harness_code
      artifact: js/src/router.js
      from_version: 1.0.0
      to_version: 1.0.1
      proposed_at: *ts
      proposed_by: optimizer
      gate: {result: pass}
      approval: {required: none}
      status: applied
  - name: change applied with failing gate
    contract: governance-change
    valid: false
    doc:
      schema_version: "1.0"
      change_id: chg-003
      change_type: prompt_or_skill_config
      artifact: prompts/rulespeak_generation.md
      from_version: 1.0.0
      to_version: 1.0.1
      proposed_at: *ts
      proposed_by: optimizer
      gate: {result: fail}
      approval: {required: spot_review}
      status: applied

  # JavaScript domain (J2 generate in tranche 1; J1 advise and J3 correct frozen now, used in tranche 2)
  - name: J2 generation request with a typed function spec
    contract: request
    valid: true
    doc:
      schema_version: "1.0"
      request_id: js-req-001
      task: js_generation
      submitted_at: *ts
      payload:
        spec:
          name: chunk
          params:
            - {name: items, type: "any[]", description: the array to split}
            - {name: size, type: number, description: a positive integer}
          returns: {type: "any[][]"}
          behavior: Split items into consecutive arrays of length size. The last array holds the remainder. Throw a RangeError if size is not a positive integer.
          examples:
            - {args: [[1, 2, 3, 4, 5], 2], returns: [[1, 2], [3, 4], [5]]}
            - {args: [[], 3], returns: []}
            - {args: [[1], 0], throws: RangeError}
          constraints: [do not mutate items]
  - name: J2 example with both returns and throws
    contract: js_function_spec
    valid: false
    doc:
      name: f
      params: []
      returns: {type: number}
      behavior: Returns one.
      examples: [{args: [], returns: 1, throws: Error}]
  - name: J2 spec with an invalid function name
    contract: js_function_spec
    valid: false
    doc: {name: "2fast", params: [], returns: {type: number}, behavior: Returns one.}
  - name: J2 request with a free-text prompt instead of a spec
    contract: request
    valid: false
    doc:
      schema_version: "1.0"
      request_id: js-req-002
      task: js_generation
      submitted_at: *ts
      payload: {prompt: write me a chunk function}
  - name: J2 resolved response with module and sandbox report
    contract: response
    valid: true
    doc:
      schema_version: "1.0"
      request_id: js-req-001
      task: js_generation
      status: resolved
      route: {tier: lookup, rule_id: "task-field", config_version: "1.0.0", target: js_generation}
      completed_at: *ts
      output:
        module:
          filename: chunk.mjs
          code: |
            export function chunk(items, size) {
              if (!Number.isInteger(size) || size < 1) throw new RangeError("size must be a positive integer");
              const out = [];
              for (let i = 0; i < items.length; i += size) out.push(items.slice(i, i + size));
              return out;
            }
        assumptions: []
        questions: []
        execution:
          parsed: true
          lint: []
          tests:
            - {name: splits with remainder, status: pass, duration_ms: 0.4}
            - {name: rejects size 0, status: pass, duration_ms: 0.2}
          violations: []
          environment: {node_version: v22.11.0, profile_version: 0.1.0, timeout_ms: 2000, memory_mb: 128, clock: *ts, seed: 42}
  - name: J2 output with neither module nor question
    contract: js_generation_output
    valid: false
    doc: {questions: []}
  - name: J2 output asking instead of guessing
    contract: js_generation_output
    valid: true
    doc: {questions: [{text: "Should a size larger than the array return one chunk or throw?"}]}
  - name: sandbox report with an unknown violation kind
    contract: js_execution
    valid: false
    doc: {parsed: true, lint: [], tests: [], violations: [gpu], environment: {node_version: v22.11.0, profile_version: 0.1.0}}
  - name: J1 advice request and findings
    contract: response
    valid: true
    doc:
      schema_version: "1.0"
      request_id: js-req-010
      task: js_advice
      status: resolved
      route: {tier: lookup, rule_id: "task-field", config_version: "1.0.0", target: js_advice}
      completed_at: *ts
      output:
        findings:
          - {code: JS-LINT-001, rule: no-unused-vars, category: correctness, severity: warning, basis: lint, message: "'tmp' is assigned a value but never used.", range: {start_line: 3, end_line: 3}}
          - {code: JS-DES-001, category: design, severity: info, basis: model, message: The loop recomputes the total on every iteration., range: {start_line: 5, end_line: 9}, suggestion: Compute the total once before the loop.}
        questions: []
  - name: J1 finding with an RS code
    contract: js_finding
    valid: false
    doc: {code: RS-KW-001, severity: error, basis: lint, message: wrong taxonomy, range: {start_line: 1, end_line: 1}}
  - name: J3 correction request from a failing test
    contract: request
    valid: true
    doc:
      schema_version: "1.0"
      request_id: js-req-020
      task: js_correction
      submitted_at: *ts
      payload:
        source: {filename: sum.mjs, code: "export const sum = (xs) => xs.reduce((a, b) => a + b);\n"}
        failure: {kind: test_failure, test_name: sum of empty array is 0, message: "TypeError: Reduce of empty array with no initial value", error_type: TypeError}
  - name: J3 correction request without a failure signal
    contract: request
    valid: false
    doc:
      schema_version: "1.0"
      request_id: js-req-021
      task: js_correction
      submitted_at: *ts
      payload: {source: {code: "export const f = () => 1;\n"}}
  - name: handoff of a generated module
    contract: handoff-artifact
    valid: true
    doc:
      schema_version: "1.0"
      artifact_id: art-js-001
      artifact_type: js_module
      content: "export const one = () => 1;\n"
      source_request_id: js-req-001
      produced_at: *ts
      profile_version: 0.1.0
      execution: {parsed: true, lint: [], tests: [{name: returns one, status: pass}], violations: [], environment: {node_version: v22.11.0, profile_version: 0.1.0}}
      checker: {passed: true, codes: []}
  - name: handoff of a module without its sandbox report
    contract: handoff-artifact
    valid: false
    doc:
      schema_version: "1.0"
      artifact_id: art-js-002
      artifact_type: js_module
      content: "export const one = () => 1;\n"
      source_request_id: js-req-001
      produced_at: *ts
      profile_version: 0.1.0
      checker: {passed: true, codes: []}
